services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    container_name: marginguard-db
    environment:
      POSTGRES_USER: marginguard
      POSTGRES_PASSWORD: marginguard_dev
      POSTGRES_DB: marginguard_incentives
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginguard -d marginguard_incentives"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marginguard-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://marginguard:marginguard_dev@postgres:5432/marginguard_incentives
      NODE_ENV: development
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ApR0CY+KUia6o/XX/gTrIqUj2qLgBRTc0rpBx5Fef9E=
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
