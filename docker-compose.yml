services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marginguard-postgres
    environment:
      POSTGRES_DB: incentives
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
