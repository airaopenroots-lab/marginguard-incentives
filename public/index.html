  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

an style=\"font-weight:600;font-size:15px;letter-spacing:.02em;\">MarginGrid<\u002Fspan>\n      <span style=\"font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#3538cd;\">AI Incentives<\u002Fspan>\n    <\u002Fspan>\n  <\u002Fa>\n  <nav style=\"display:flex;align-items:center;gap:30px;\">\n    <a href=\"#problem\" style=\"color:#475467;font-size:14px;font-weight:500;\">Problem<\u002Fa>\n    <a href=\"#how\" style=\"color:#475467;font-size:14px;font-weight:500;\">How it works<\u002Fa>\n    <a href=\"#cases\" style=\"color:#475467;font-size:14px;font-weight:500;\">Use cases<\u002Fa>\n    <a href=\"#roi\" style=\"color:#475467;font-size:14px;font-weight:500;\">Live example<\u002Fa>\n    <a href=\"#trends\" style=\"color:#475467;font-size:14px;font-weight:500;\">Why now<\u002Fa>\n  <\u002Fnav>\n  <div style=\"display:flex;align-items:center;gap:12px;\">\n    <a href=\"{{ demoUrl }}\" style=\"font-size:13px;font-weight:600;letter-spacing:.04em;color:#0f1729;padding:10px 16px;border-radius:6px;border:1px solid rgba(15,23,41,.18);\">Log in<\u002Fa>\n    <a href=\"{{ demoUrl }}\" style=\"font-size:13px;font-weight:600;letter-spacing:.05em;color:#ffffff;padding:11px 20px;border-radius:6px;background:linear-gradient(135deg,#4f52e0,#3538cd);box-shadow:0 10px 28px -12px rgba(53,56,205,.4);\">Demo the product →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\" style=\"position:relative;z-index:1;\">\n\n  <!-- ===================== HERO ===================== -->\n  <section style=\"min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:1200px;margin:0 auto;padding:150px clamp(20px,4vw,52px) 70px;\">\n    <div data-reveal=\"\" style=\"display:flex;align-items:center;gap:.7em;font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:30px;\">\n      <span style=\"color:#3538cd;\">✦<\u002Fspan> MarginGrid Series <span style=\"color:rgba(53,56,205,.4);\">·<\u002Fspan> <span style=\"color:#667085;\">Behavioral Incentive Intelligence<\u002Fspan>\n    <\u002Fdiv>\n    <h1 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,7.4vw,104px);line-height:.98;letter-spacing:-.015em;color:#0f1729;max-width:16ch;margin-bottom:30px;text-wrap:balance;\">\n      Stop conceding margin you <em style=\"font-style:italic;font-weight:500;background:linear-gradient(100deg,#3538cd 0%,#3538cd 38%,#6366f1 50%,#3538cd 62%,#3538cd 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 7s ease-in-out 1.6s infinite;\">cannot see<\u002Fem>.\n    <\u002Fh1>\n    <p data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(19px,2.3vw,29px);line-height:1.36;color:#3538cd;max-width:30ch;margin-bottom:26px;text-wrap:balance;\">Two customers ask for the same discount. Only one of them earns it back.<\u002Fp>\n    <p data-reveal=\"\" style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.7;color:#475467;max-width:56ch;margin-bottom:38px;\">AI Incentives reads the behavior your ledger already records — how each customer pays, adjusts, returns, and re-buys — and prices every deal, rebate, and program to its true net value. Incumbents stop at the quote and the invoice. We continue into everything that happens after.<\u002Fp>\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:14px;margin-bottom:56px;\">\n      <a href=\"{{ demoUrl }}\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;gap:.6em;font-size:14px;font-weight:600;letter-spacing:.05em;color:#ffffff;padding:16px 28px;border-radius:6px;background:linear-gradient(135deg,#4f52e0,#3538cd);box-shadow:0 14px 34px -12px rgba(53,56,205,.4);\">Demo the product <span style=\"font-size:16px;\">→<\u002Fspan><\u002Fa>\n      <a href=\"#roi\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;gap:.6em;font-size:14px;font-weight:600;letter-spacing:.05em;color:#0f1729;padding:16px 28px;border-radius:6px;border:1px solid rgba(15,23,41,.2);background:rgba(15,23,41,.015);\">Try the live example<\u002Fa>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(15,23,41,.08);border:1px solid rgba(15,23,41,.08);border-radius:12px;overflow:hidden;\">\n      <sc-for list=\"{{ heroStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background:#ffffff;padding:22px 20px;\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(26px,2.8vw,40px);color:#3538cd;line-height:1;margin-bottom:8px;\">{{ s.v }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.4;color:#475467;\">{{ s.l }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== PROBLEM ===================== -->\n  <section id=\"problem\" style=\"max-width:1200px;margin:0 auto;padding:clamp(70px,10vh,120px) clamp(20px,4vw,52px);\">\n    <div data-reveal=\"\" style=\"max-width:60ch;margin-bottom:56px;\">\n      <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">The problem<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">One price list. Every customer treated the same.<\u002Fh2>\n      <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">A gross-margin-only tool approves the maximum available program by default and calls it discipline. It cannot see that the same $12,000 concession is a bargain for one customer and a slow, adjustment-heavy loss for the next. Margin erosion never announces itself — it accrues, deal by deal, quarter by quarter.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;\">\n      <sc-for list=\"{{ leakZones }}\" as=\"z\" hint-placeholder-count=\"3\">\n        <div style=\"padding:30px 26px;border-radius:14px;border:1px solid rgba(15,23,41,.09);background:linear-gradient(180deg,rgba(15,23,41,.02),rgba(15,23,41,.006));\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:34px;color:#3538cd;margin-bottom:14px;\">{{ z.n }}<\u002Fdiv>\n          <h3 style=\"font-size:17px;font-weight:600;color:#0f1729;margin-bottom:10px;\">{{ z.t }}<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;color:#475467;\">{{ z.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== HOW IT WORKS ===================== -->\n  <section id=\"how\" style=\"position:relative;padding:clamp(70px,10vh,120px) 0;border-top:1px solid rgba(15,23,41,.06);border-bottom:1px solid rgba(15,23,41,.06);background:#f6f7f9;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,52px);\">\n      <div data-reveal=\"\" style=\"max-width:64ch;margin-bottom:52px;\">\n        <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">How it works<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">One behavioral feature store. Three decision surfaces.<\u002Fh2>\n        <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">All three use cases draw from one asset, built once from standard ERP data: a customer behavioral profile, refreshed continuously and versioned so models always score on point-in-time-correct history — what was known at quote time, not what was learned later.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:rgba(15,23,41,.08);border:1px solid rgba(15,23,41,.09);border-radius:16px;overflow:hidden;margin-bottom:34px;\">\n        <sc-for list=\"{{ signals }}\" as=\"sig\" hint-placeholder-count=\"6\">\n          <div style=\"background:#ffffff;padding:26px 24px;\">\n            <h3 style=\"font-size:15.5px;font-weight:600;color:#3538cd;margin-bottom:12px;line-height:1.3;\">{{ sig.t }}<\u002Fh3>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#98a2b3;margin-bottom:5px;\">Source in the ERP<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.55;color:#667085;margin-bottom:14px;\">{{ sig.src }}<\u002Fp>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#98a2b3;margin-bottom:5px;\">What it feeds<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.55;color:#667085;\">{{ sig.feeds }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;\">\n        <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;gap:16px;padding:24px 26px;border-radius:14px;background:rgba(53,56,205,.05);border:1px solid rgba(53,56,205,.18);\">\n            <span style=\"font-family:'Instrument Serif',serif;font-size:26px;color:#3538cd;line-height:1;\">{{ p.n }}<\u002Fspan>\n            <div>\n              <h3 style=\"font-size:16px;font-weight:600;margin-bottom:8px;\">{{ p.t }}<\u002Fh3>\n              <p style=\"font-size:14px;line-height:1.62;color:#475467;\">{{ p.d }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== USE CASES ===================== -->\n  <section id=\"cases\" style=\"max-width:1200px;margin:0 auto;padding:clamp(70px,10vh,120px) clamp(20px,4vw,52px);\">\n    <div data-reveal=\"\" style=\"max-width:60ch;margin-bottom:52px;\">\n      <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">Use cases<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">Three deep dives, one learning loop.<\u002Fh2>\n      <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">The program loop learns what incentives actually caused. The segment designer keeps cost-equivalence and response curves honest. The deal desk makes the call, deal by deal. Each surface feeds the next.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <sc-for list=\"{{ useCases }}\" as=\"u\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;align-items:center;padding:clamp(28px,3.5vw,48px);border-radius:18px;border:1px solid rgba(15,23,41,.09);background:linear-gradient(120deg,rgba(15,23,41,.02),rgba(15,23,41,.006));\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n              <span style=\"font-family:'Instrument Serif',serif;font-size:15px;color:#ffffff;background:linear-gradient(135deg,#4f52e0,#3538cd);width:40px;height:40px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;\">{{ u.n }}<\u002Fspan>\n              <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#3538cd;\">{{ u.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Instrument Serif',serif;font-weight:500;font-size:clamp(23px,2.5vw,32px);line-height:1.12;margin-bottom:14px;\">{{ u.title }}<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.68;color:#475467;\">{{ u.desc }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#98a2b3;\">What it delivers<\u002Fdiv>\n            <sc-for list=\"{{ u.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.5;color:#344054;\">\n                <span style=\"color:#3538cd;margin-top:2px;\">◆<\u002Fspan><span>{{ b }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== INTERACTIVE ROI ===================== -->\n  <section id=\"roi\" style=\"position:relative;padding:clamp(70px,10vh,120px) 0;border-top:1px solid rgba(15,23,41,.06);border-bottom:1px solid rgba(15,23,41,.06);background:#f6f7f9;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,52px);\">\n      <div data-reveal=\"\" style=\"max-width:64ch;margin-bottom:44px;\">\n        <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">See it live<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">Same concession. Same margin pool. Different answer.<\u002Fh2>\n        <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">Two fleet customers request the same concession on a configuration with a <strong style=\"color:#0f1729;font-weight:600;\">$30,000 margin pool<\u002Fstrong>. Drag the slider — watch expected net value diverge as the behavioral layer prices in each customer's payment speed and post-sale adjustments.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"border-radius:18px;border:1px solid rgba(15,23,41,.12);background:#ffffff;overflow:hidden;\">\n        <div style=\"padding:clamp(24px,3vw,40px);border-bottom:1px solid rgba(15,23,41,.07);\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:8px;\">\n            <label style=\"font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#3538cd;\">Requested concession<\u002Flabel>\n            <span style=\"font-family:'Instrument Serif',serif;font-size:clamp(30px,4vw,46px);color:#3538cd;line-height:1;\">{{ concLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"12000\" step=\"250\" value=\"{{ concession }}\" sc-camel-on-input=\"{{ onConcession }}\" style=\"width:100%;height:5px;-webkit-appearance:none;appearance:none;border-radius:6px;background:rgba(15,23,41,.1);outline:none;cursor:pointer;accent-color:#3538cd;margin-top:8px;\">\n          <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:#98a2b3;margin-top:8px;\"><span>$0<\u002Fspan><span>$6,000<\u002Fspan><span>$12,000<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));\">\n          <!-- Customer A -->\n          <div style=\"padding:clamp(24px,3vw,38px);border-right:1px solid rgba(15,23,41,.06);\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px;\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:#12b76a;box-shadow:0 0 12px #12b76a;\"><\u002Fspan>\n              <h3 style=\"font-size:16px;font-weight:600;\">Customer A<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"font-size:12.5px;color:#067647;margin-bottom:20px;\">Clean payer · 18-day terms · 0.3% adjustments<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13.5px;\">\n              <div style=\"display:flex;justify-content:space-between;color:#475467;\">Win probability <span style=\"color:#0f1729;font-variant-numeric:tabular-nums;\">{{ aWin }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;color:#475467;\">Behavioral cost <span style=\"color:#0f1729;font-variant-numeric:tabular-nums;\">{{ aBcost }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:22px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#98a2b3;margin-bottom:8px;\">Expected net value / unit<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(30px,4vw,44px);color:#12b76a;line-height:1;\">{{ aEnv }}<\u002Fdiv>\n            <div style=\"height:8px;border-radius:6px;background:rgba(15,23,41,.08);margin-top:16px;overflow:hidden;\"><div style=\"height:100%;border-radius:6px;background:linear-gradient(90deg,#039855,#12b76a);width:{{ aBar }};transition:width .18s ease;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <!-- Customer B -->\n          <div style=\"padding:clamp(24px,3vw,38px);\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px;\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:#f04438;box-shadow:0 0 12px #f04438;\"><\u002Fspan>\n              <h3 style=\"font-size:16px;font-weight:600;\">Customer B<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"font-size:12.5px;color:#b42318;margin-bottom:20px;\">Slow, adjustment-heavy · 75-day terms · 2.1% adjustments<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13.5px;\">\n              <div style=\"display:flex;justify-content:space-between;color:#475467;\">Win probability <span style=\"color:#0f1729;font-variant-numeric:tabular-nums;\">{{ bWin }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;color:#475467;\">Behavioral cost <span style=\"color:#0f1729;font-variant-numeric:tabular-nums;\">{{ bBcost }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:22px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#98a2b3;margin-bottom:8px;\">Expected net value / unit<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(30px,4vw,44px);color:#f04438;line-height:1;\">{{ bEnv }}<\u002Fdiv>\n            <div style=\"height:8px;border-radius:6px;background:rgba(15,23,41,.08);margin-top:16px;overflow:hidden;\"><div style=\"height:100%;border-radius:6px;background:linear-gradient(90deg,#d92d20,#f04438);width:{{ bBar }};transition:width .18s ease;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:clamp(22px,3vw,34px) clamp(24px,3vw,40px);background:linear-gradient(180deg,rgba(53,56,205,.06),rgba(53,56,205,.02));border-top:1px solid rgba(15,23,41,.09);\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#3538cd;margin-bottom:10px;\">System recommendation<\u002Fdiv>\n          <p style=\"font-size:clamp(15px,1.5vw,18px);line-height:1.6;color:#0f1729;text-wrap:pretty;\">{{ recommendation }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"font-size:13px;color:#98a2b3;margin-top:18px;max-width:70ch;\">Illustrative model on the deep-dive figures. A gross-margin-only tool treats these two requests identically; the behavioral layer recovers real margin per unit that would otherwise be conceded by default.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== TESTIMONIALS ===================== -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:clamp(70px,10vh,120px) clamp(20px,4vw,52px);\">\n    <div data-reveal=\"\" style=\"text-align:center;max-width:58ch;margin:0 auto 48px;\">\n      <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">In the field<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,4.4vw,54px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance;\">Trusted where every basis point is defended.<\u002Fh2>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;\">\n      <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <figure style=\"padding:32px 30px;border-radius:16px;border:1px solid rgba(15,23,41,.09);background:linear-gradient(180deg,rgba(15,23,41,.02),rgba(15,23,41,.006));display:flex;flex-direction:column;gap:20px;\">\n          <div style=\"color:#3538cd;font-size:22px;letter-spacing:2px;\">★★★★★<\u002Fdiv>\n          <blockquote style=\"font-family:'Instrument Serif',serif;font-size:19px;line-height:1.5;color:#0f1729;font-style:italic;\">\"{{ t.quote }}\"<\u002Fblockquote>\n          <figcaption style=\"margin-top:auto;border-top:1px solid rgba(15,23,41,.08);padding-top:16px;\">\n            <div style=\"font-weight:600;font-size:14px;color:#0f1729;\">{{ t.who }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#475467;margin-top:2px;\">{{ t.org }}<\u002Fdiv>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== TRENDS / WHY NOW ===================== -->\n  <section id=\"trends\" style=\"position:relative;padding:clamp(70px,10vh,120px) 0;border-top:1px solid rgba(15,23,41,.06);background:#f6f7f9;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,52px);\">\n      <div data-reveal=\"\" style=\"max-width:64ch;margin-bottom:50px;\">\n        <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">Why now — the 2026 shift<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">Pricing is where agentic AI pays for itself first.<\u002Fh2>\n        <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">The market has moved from copilots that summarize to agents that decide within guardrails. Pricing stands out among enterprise functions for delivering both efficiency and effectiveness — higher realization, higher win rates, less leakage, larger deals. AI Incentives is built for exactly that graduated autonomy: human on the loop, evidence in the open.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;\">\n        <sc-for list=\"{{ trends }}\" as=\"tr\" hint-placeholder-count=\"4\">\n          <div style=\"padding:28px 26px;border-radius:14px;border:1px solid rgba(15,23,41,.09);background:#ffffff;\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(30px,3vw,42px);color:#3538cd;line-height:1;margin-bottom:12px;\">{{ tr.k }}<\u002Fdiv>\n            <h3 style=\"font-size:15.5px;font-weight:600;margin-bottom:9px;line-height:1.3;\">{{ tr.t }}<\u002Fh3>\n            <p style=\"font-size:13.5px;line-height:1.58;color:#475467;margin-bottom:12px;\">{{ tr.d }}<\u002Fp>\n            <div style=\"font-size:11px;letter-spacing:.06em;color:#98a2b3;\">{{ tr.src }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== BUILT ON / TECH STACK ===================== -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:clamp(70px,10vh,120px) clamp(20px,4vw,52px);\">\n    <div data-reveal=\"\" style=\"max-width:64ch;margin-bottom:46px;\">\n      <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">Built on<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;text-wrap:balance;\">A reference stack designed for trust at the deal desk.<\u002Fh2>\n      <p style=\"font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:#475467;\">Point-in-time-correct features, explainable models with hard guardrails, and real-time scoring that slots into your existing CPQ and ERP. Our recommended architecture, top to bottom:<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:12px;\">\n      <sc-for list=\"{{ stack }}\" as=\"l\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:24px;align-items:center;padding:22px 26px;border-radius:13px;border:1px solid rgba(15,23,41,.08);background:linear-gradient(100deg,rgba(53,56,205,.04),rgba(15,23,41,.01));\">\n          <div>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#98a2b3;margin-bottom:6px;\">{{ l.layer }}<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;color:#3538cd;line-height:1.3;\">{{ l.tools }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;color:#475467;\">{{ l.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== CONTACT ===================== -->\n  <section id=\"contact\" style=\"position:relative;padding:clamp(70px,10vh,120px) 0;border-top:1px solid rgba(15,23,41,.06);background:#f6f7f9;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,52px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(32px,5vw,72px);align-items:start;\">\n      <div data-reveal=\"\">\n        <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#3538cd;margin-bottom:18px;\">Contact us<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,4.2vw,52px);line-height:1.05;letter-spacing:-.01em;margin-bottom:20px;text-wrap:balance;\">See it on your own ledger.<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.7;color:#475467;margin-bottom:32px;\">Tell us about your deal desk and program mix. We'll run a scoped read on a slice of your history and show you the margin the behavioral layer would have recovered — before you commit to anything.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:18px;\">\n          <div style=\"display:flex;gap:13px;align-items:center;font-size:14px;color:#344054;\"><span style=\"color:#3538cd;\">✉<\u002Fspan> hello@margingrid.ai<\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:center;font-size:14px;color:#344054;\"><span style=\"color:#3538cd;\">◷<\u002Fspan> Response within one business day<\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:center;font-size:14px;color:#344054;\"><span style=\"color:#3538cd;\">⛨<\u002Fspan> SOC 2 Type II · deploys in your VPC<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:44px 36px;border-radius:16px;border:1px solid rgba(18,183,106,.45);background:rgba(18,183,106,.08);text-align:center;\">\n            <div style=\"font-size:40px;margin-bottom:14px;\">✦<\u002Fdiv>\n            <h3 style=\"font-family:'Instrument Serif',serif;font-size:26px;margin-bottom:10px;\">Thank you — request received.<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;color:#667085;\">A MarginGrid solutions engineer will reach out within one business day to scope your read. In the meantime, feel free to <a href=\"{{ demoUrl }}\">explore the live demo<\u002Fa>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"padding:clamp(26px,3vw,38px);border-radius:16px;border:1px solid rgba(15,23,41,.12);background:#ffffff;display:flex;flex-direction:column;gap:18px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n              <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#3538cd;\">Full name\n                <input name=\"name\" required=\"\" placeholder=\"Jordan Vance\" style=\"font-family:inherit;font-size:14px;color:#0f1729;padding:12px 14px;border-radius:8px;border:1px solid rgba(15,23,41,.16);background:rgba(15,23,41,.02);outline:none;\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#3538cd;\">Work email\n                <input name=\"email\" type=\"email\" required=\"\" placeholder=\"you@company.com\" style=\"font-family:inherit;font-size:14px;color:#0f1729;padding:12px 14px;border-radius:8px;border:1px solid rgba(15,23,41,.16);background:rgba(15,23,41,.02);outline:none;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n              <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#3538cd;\">Company\n                <input name=\"company\" required=\"\" placeholder=\"Acme Industrial\" style=\"font-family:inherit;font-size:14px;color:#0f1729;padding:12px 14px;border-radius:8px;border:1px solid rgba(15,23,41,.16);background:rgba(15,23,41,.02);outline:none;\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#3538cd;\">Role\n                <input name=\"role\" placeholder=\"VP, Commercial / Pricing\" style=\"font-family:inherit;font-size:14px;color:#0f1729;padding:12px 14px;border-radius:8px;border:1px solid rgba(15,23,41,.16);background:rgba(15,23,41,.02);outline:none;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#3538cd;\">What are you trying to fix?\n              <textarea name=\"message\" rows=\"4\" placeholder=\"e.g. concessions creeping up on contested fleet deals; back-end program breakage we can't forecast...\" style=\"font-family:inherit;font-size:14px;color:#0f1729;padding:12px 14px;border-radius:8px;border:1px solid rgba(15,23,41,.16);background:rgba(15,23,41,.02);outline:none;resize:vertical;\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" data-magnetic=\"\" style=\"margin-top:4px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.05em;color:#ffffff;padding:15px 26px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#4f52e0,#3538cd);box-shadow:0 12px 30px -12px rgba(53,56,205,.4);\">Request a scoped read →<\u002Fbutton>\n            <p style=\"font-size:11.5px;color:#98a2b3;text-align:center;\">No spam. We only use this to prepare your read.<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FINAL CTA ===================== -->\n  <section style=\"max-width:1000px;margin:0 auto;padding:clamp(80px,12vh,140px) clamp(20px,4vw,52px);text-align:center;\">\n    <h2 data-reveal=\"\" style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,6vw,82px);line-height:1;letter-spacing:-.015em;margin-bottom:26px;text-wrap:balance;\">Price the customer,<br>not the price list.<\u002Fh2>\n    <p data-reveal=\"\" style=\"font-size:clamp(16px,1.4vw,20px);line-height:1.6;color:#475467;max-width:48ch;margin:0 auto 38px;\">Log in to walk the deal desk, segment designer, and program loop on live figures.<\u002Fp>\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;\">\n      <a href=\"{{ demoUrl }}\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;gap:.6em;font-size:15px;font-weight:600;letter-spacing:.05em;color:#ffffff;padding:17px 32px;border-radius:7px;background:linear-gradient(135deg,#4f52e0,#3538cd);box-shadow:0 16px 40px -14px rgba(53,56,205,.45);\">Demo the product <span style=\"font-size:17px;\">→<\u002Fspan><\u002Fa>\n      <a href=\"#contact\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;font-size:15px;font-weight:600;letter-spacing:.05em;color:#0f1729;padding:17px 32px;border-radius:7px;border:1px solid rgba(15,23,41,.2);\">Talk to us<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"border-top:1px solid rgba(15,23,41,.07);background:#f6f7f9;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,7vh,80px) clamp(20px,4vw,52px);\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr);gap:clamp(32px,6vw,80px);margin-bottom:48px;\">\n        <div>\n          <a href=\"#top\" style=\"display:flex;align-items:center;gap:12px;color:#0f1729;margin-bottom:18px;\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#4f52e0,#3538cd);color:#ffffff;font-weight:700;font-size:16px;font-family:'Instrument Serif',serif;\">M<\u002Fspan>\n            <span style=\"font-weight:600;font-size:16px;\">MarginGrid<\u002Fspan>\n          <\u002Fa>\n          <p style=\"font-size:13.5px;line-height:1.6;color:#667085;max-width:34ch;\">The behavioral intelligence layer for commercial decisions. One feature store, every margin call.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#98a2b3;margin-bottom:16px;\">The MarginGrid series<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;\">\n            <sc-for list=\"{{ series }}\" as=\"app\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:3px;\">\n                <div style=\"display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#0f1729;\">{{ app.name }}<span style=\"font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid {{ app.tagBorder }};color:{{ app.tagColor }};\">{{ app.tag }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#667085;line-height:1.4;\">{{ app.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center;padding-top:26px;border-top:1px solid rgba(15,23,41,.06);\">\n        <div style=\"font-size:12.5px;color:#98a2b3;\">© 2026 MarginGrid, Inc. · A behavioral incentive intelligence company.<\u002Fdiv>\n        <div style=\"display:flex;gap:24px;font-size:12.5px;\">\n          <a href=\"#\" style=\"color:#475467;\">Privacy<\u002Fa>\n          <a href=\"#\" style=\"color:#475467;\">Security<\u002Fa>\n          <a href=\"{{ demoUrl }}\" style=\"color:#3538cd;\">Log in →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;particles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;particleCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:200,&quot;min&quot;:40,&quot;max&quot;:260,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:120,&quot;min&quot;:0,&quot;max&quot;:160,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    concession: 7000,\n    submitted: false,\n    canvas: null,\n  };\n\n  // ---------- behavioral model ----------\n  winA(x){ return 0.62 + 0.36/(1+Math.exp(-(x-2500)/2200)); }\n  winB(x){ return 0.17 + 0.80/(1+Math.exp(-(x-7000)/2600)); }\n  bcostA(){ return 600; }\n  bcostB(){ return 4300; }\n  envA(x){ return this.winA(x)*(30000 - x - this.bcostA()); }\n  envB(x){ return this.winB(x)*(30000 - x - this.bcostB()); }\n  argmax(fn){\n    let best=0, bestV=-Infinity;\n    for(let x=0;x<=12000;x+=250){ const v=fn(x); if(v>bestV){bestV=v;best=x;} }\n    return {x:best, v:bestV};\n  }\n  usd(n){ return '$'+Math.round(n).toLocaleString('en-US'); }\n  usdK(n){ return '$'+(n/1000).toFixed(1).replace(/\\.0$/,'')+'K'; }\n\n  componentDidMount(){\n    this.setupCanvas();\n    this.setupReveal();\n    this.setupMagnetic();\n  }\n  componentWillUnmount(){\n    if(this._raf) cancelAnimationFrame(this._raf);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  setupCanvas(){\n    const c = this.state.canvas;\n    if(!c || (this.props.particles===false)) return;\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const ctx = c.getContext('2d');\n    const dpr = Math.min(window.devicePixelRatio||1, 2);\n    const count = Math.round(this.props.particleCount ?? 130);\n    const glow = (this.props.glow ?? 100)/100;\n    const palette = ['rgba(53,56,205,', 'rgba(71,84,103,', 'rgba(99,102,241,', 'rgba(148,163,184,'];\n    let W=0,H=0,parts=[];\n    const build=()=>{\n      const r=c.getBoundingClientRect(); W=r.width; H=r.height;\n      c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);\n      parts=[];\n      for(let i=0;i<count;i++){\n        parts.push({x:Math.random()*W, y:Math.random()*H, r:0.4+Math.random()*1.9,\n          s:0.15+Math.random()*0.5, ph:Math.random()*Math.PI*2,\n          col:palette[(Math.random()*palette.length)|0], sp:0.4+Math.random()*0.9});\n      }\n    };\n    this._onResize=build; build(); window.addEventListener('resize', build);\n    if(reduce){\n      ctx.clearRect(0,0,W,H);\n      parts.forEach(p=>{ ctx.beginPath(); ctx.fillStyle=p.col+(0.5*glow)+')'; ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); });\n      return;\n    }\n    let t=0;\n    const tick=()=>{\n      t+=0.016; ctx.clearRect(0,0,W,H);\n      for(const p of parts){\n        p.y -= p.s; p.x += Math.sin(t*p.sp+p.ph)*0.18;\n        if(p.y< -4) p.y=H+4;\n        const tw=0.35+0.65*(0.5+0.5*Math.sin(t*1.4+p.ph));\n        ctx.beginPath(); ctx.fillStyle=p.col+(tw*glow*0.5)+')';\n        ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();\n      }\n      this._raf=requestAnimationFrame(tick);\n    };\n    tick();\n  }\n\n  setupReveal(){\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    if(reduce || !('IntersectionObserver' in window)) return;\n    els.forEach(el=>{ el.style.opacity='0'; el.style.transform='translateY(30px)'; el.style.transition='opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1)'; });\n    const io=new IntersectionObserver((ents)=>{\n      ents.forEach(e=>{ if(e.isIntersecting){ e.target.style.opacity='1'; e.target.style.transform='none'; io.unobserve(e.target); } });\n    },{threshold:0.12, rootMargin:'0px 0px -8% 0px'});\n    els.forEach(el=>io.observe(el));\n  }\n\n  setupMagnetic(){\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if(reduce) return;\n    document.querySelectorAll('[data-magnetic]').forEach(btn=>{\n      btn.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';\n      btn.addEventListener('pointermove', e=>{\n        const r=btn.getBoundingClientRect();\n        btn.style.transform=`translate(${(e.clientX-r.left-r.width/2)*0.12}px, ${(e.clientY-r.top-r.height/2)*0.2 - 2}px)`;\n      });\n      btn.addEventListener('pointerleave', ()=>{ btn.style.transform='none'; });\n    });\n  }\n\n  onConcession = (e)=>{ this.setState({concession: +e.target.value}); };\n  onSubmit = (e)=>{ e.preventDefault(); this.setState({submitted:true}); try{ window.scrollBy({top:1,behavior:'smooth'}); }catch(_){} };\n\n  renderVals(){\n    const c = this.state.concession;\n    const aEnvV=this.envA(c), bEnvV=this.envB(c);\n    const aRec=this.argmax(x=>this.envA(x)), bRec=this.argmax(x=>this.envB(x));\n    const aFull=this.envA(12000), bFull=this.envB(12000);\n    const aSave=aRec.v-aFull, bSave=bRec.v-bFull;\n\n    let rec;\n    if(c >= aRec.x + 1500){\n      rec = `On Customer A, the deeper cut isn't justified — counter at ${this.usdK(aRec.x)} to hold ${this.usd(aRec.v)}/unit and recover roughly ${this.usd(aSave)} that a default full concession would give away. On Customer B, the same request is far costlier once slow payment and adjustments are priced in — approve only with an account flag for terms review.`;\n    } else {\n      rec = `At ${this.usdK(c)}, Customer A returns ${this.usd(aEnvV)}/unit versus just ${this.usd(bEnvV)} on Customer B — the behavioral cost gap is ${this.usd((this.bcostB())-(this.bcostA()))}/unit. Customer A's evidence-based optimum sits near ${this.usdK(aRec.x)}; Customer B needs a different vehicle, not a deeper discount.`;\n    }\n\n    return {\n      demoUrl: '/login',\n      canvas: (el)=>{ if(el && el!==this.state.canvas) this.setState({canvas:el}); },\n\n      concession: c,\n      concLabel: this.usd(c),\n      onConcession: this.onConcession,\n      aWin: (this.winA(c)*100).toFixed(0)+'%',\n      bWin: (this.winB(c)*100).toFixed(0)+'%',\n      aBcost: this.usd(this.bcostA()),\n      bBcost: this.usd(this.bcostB()),\n      aEnv: this.usd(aEnvV),\n      bEnv: this.usd(bEnvV),\n      aBar: Math.max(0,Math.min(100, aEnvV/300))+'%',\n      bBar: Math.max(0,Math.min(100, bEnvV/300))+'%',\n      recommendation: rec,\n\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      onSubmit: this.onSubmit,\n\n      heroStats: [\n        {v:'17.1%', l:'of annual margin quietly erased by B2B pricing inefficiency'},\n        {v:'3–7%', l:'of recurring revenue leaks through discount & terms gaps'},\n        {v:'65–85%', l:'of pricing orgs plan to adopt AI-led pricing in 1–3 years'},\n        {v:'Weeks', l:'to value realization once behavioral features go live'},\n      ],\n      leakZones: [\n        {n:'01', t:'Unclear discount authority', d:'Approval workflows slow enough that reps self-authorize to keep deals moving — concessions creep, unmeasured.'},\n        {n:'02', t:'Stale cost-to-serve', d:'Price structures built on historical data that no longer reflects how a customer actually pays, adjusts, and returns.'},\n        {n:'03', t:'Unindexed programs', d:'Multi-year agreements and back-end rebates never restated to true cost — compounding margin compression over time.'},\n      ],\n      signals: [\n        {t:'Payment behavior', src:'AR open/cleared items, dunning history', feeds:'Carrying-cost estimate; net-value model'},\n        {t:'Adjustment intensity', src:'Credit/debit memos with reason codes', feeds:'Expected post-sale leakage per deal'},\n        {t:'Return behavior', src:'Returns orders and credit memos', feeds:'Expected leakage; risk flag'},\n        {t:'Warranty & goodwill', src:'Warranty credits, goodwill adjustments', feeds:'Expected leakage'},\n        {t:'Rebate attainment', src:'Condition-contract settlements, program attainment', feeds:'Attainment probability; back-end realism'},\n        {t:'Purchase cadence & loyalty', src:'Order and invoice history', feeds:'Lifetime-value weighting; churn risk'},\n      ],\n      principles: [\n        {n:'§', t:'Point-in-time correctness', d:'A deal scored in March may only use behavior observed before March — or models look brilliant in backtests and fail in production. Every feature is versioned to what was known at quote time.'},\n        {n:'§', t:'Graceful cold start', d:'When a customer has thin history, the profile backs off to segment-level averages with an explicit confidence value — and the recommendation UI shows that confidence honestly.'},\n      ],\n      useCases: [\n        {n:'1', tag:'Deal Desk', title:'Cost-to-Serve-Adjusted Next Best Incentive', desc:'A quote or special-pricing request enters the deal desk. The system scores it and returns approve, counter, or approve-with-a-flag — changing the default from \"maximum available program\" to \"evidence-based recommendation,\" with a plain-language explanation the approver trusts.', bullets:['Win-probability model with a monotonic constraint on incentive depth','Behavioral net-value adjustment: carrying cost + expected post-sale leakage','Ranked candidate incentives by expected net value — human stays in the loop']},\n        {n:'2', tag:'Segment Designer', title:'Incentive Mix Prescription by Segment', desc:'A dollar of incentive is not a dollar of cost. Every vehicle is normalized to expected true cost, then response curves are estimated per segment and a constrained optimizer reallocates a fixed budget to maximize incremental margin.', bullets:['Cost-equivalence: upfront, back-end, financing and vendor-funded normalized','Hierarchical response curves — partial pooling where data is thin','Budget optimizer with channel-equity and year-over-year change caps']},\n        {n:'3', tag:'Program Loop', title:'Closed-Loop Incentive Design from Post-Sale Behavior', desc:'A continuously updated scorecard per program: what did this actually cause, all-in? Incrementality against matched lookalikes, plus behavioral aftermath over 6–18 months. Verdicts write back into the other two surfaces.', bullets:['Matched-lookalike incrementality — not gross volume lift','Behavioral aftermath: payment, adjustment, return, repurchase shifts','Deal-level attribution with honest uncertainty surfaced in the UI']},\n      ],\n      testimonials: [\n        {quote:'We thought our discount discipline was tight. AI Incentives showed us six figures per quarter walking out the door on customers who never paid on the terms we priced.', who:'VP, Commercial Excellence', org:'Fortune 500 industrial manufacturer'},\n        {quote:'The behavioral layer settled an argument finance and sales had been having for a decade. Same concession, different customer, different answer — with the math to back it.', who:'SVP, Pricing & Revenue', org:'Global equipment distributor'},\n        {quote:'What sold our deal desk was the explanation on every recommendation. Approvers trust it because they can see exactly why, and override with a reason code when they disagree.', who:'Director, Deal Desk Operations', org:'Fortune 100 building-products company'},\n      ],\n      trends: [\n        {k:'40%', t:'Agents in the enterprise', d:'Of enterprise apps will embed task-specific AI agents by end of 2026, up from under 5% a year earlier.', src:'Gartner, 2025'},\n        {k:'250bps', t:'Pricing is the payoff', d:'A $15B B2B distributor stacked 50bps of agentic uplift on 200bps from analytical AI — value realization compressed from years to weeks.', src:'McKinsey, 2026'},\n        {k:'On-the-loop', t:'Guardrails, not autopilot', d:'Leading orgs pair dynamic AI execution with deterministic guardrails and human judgment at key decision points.', src:
